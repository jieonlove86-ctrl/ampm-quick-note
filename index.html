<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMPM QUICK NOTE</title><style>
:root{--ink:#263139;--sub:#738087;--line:#e6edeb;--mint:#bce3d8;--dark:#315d55;--bg:#f4f8f7}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg);font-size:16px}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #79b7aa} .app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:30px 19px;display:flex;flex-direction:column;gap:8px}.brand{font-size:14px;font-weight:800;letter-spacing:.16em;padding:0 12px 30px}.brand strong{display:block;font-size:22px;letter-spacing:-.04em;margin-top:7px}.side small{padding:12px;color:#899992;font-size:12px;font-weight:700}.nav{border:0;background:transparent;text-align:left;padding:12px;border-radius:10px;color:#60716e;font-size:14px;font-weight:700}.nav:hover,.nav.active{background:#e8f4f0;color:#285b50}.nav span{display:inline-block;width:29px;color:#6e9e90}.sidefoot{margin-top:auto;padding:20px 12px 0;color:#91a19c;font-size:12px;line-height:1.7}.main{padding:34px 48px 70px;max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:22px}.top .tag{font-size:12px;letter-spacing:.17em;color:#87a39a;font-weight:800}.top h1{margin:7px 0 0;font-size:23px;letter-spacing:-.04em}.controls{display:flex;gap:8px;align-items:center}.button{border:1px solid #d6e6e0;background:white;color:#46665e;border-radius:9px;padding:10px 14px;font-size:14px;font-weight:700}.button.primary{background:var(--dark);border-color:var(--dark);color:white}.button:hover{filter:brightness(.97)}.hero{margin:30px 0;display:grid;grid-template-columns:1.2fr 1fr;min-height:190px;background:#dcefe8;border-radius:18px;overflow:hidden}.hero-copy{padding:32px 36px}.eyebrow{color:#60877c;font-weight:800;font-size:12px;letter-spacing:.14em}.hero h2{margin:12px 0;font-size:28px;line-height:1.35;letter-spacing:-.06em}.hero p{color:#608077;font-size:14px;line-height:1.7;margin:0}.hero-art{position:relative;display:flex;justify-content:center;align-items:center}.paper{width:180px;height:135px;background:#fffefa;border-radius:8px;transform:rotate(-5deg);box-shadow:0 14px 25px #8ab0a044;padding:19px;color:#7aa79a}.paper i{display:block;height:1px;background:#dceae5;margin:14px 0}.circle{position:absolute;width:100px;height:100px;border-radius:50%;background:#bcded1;right:20%;top:20px}.section-head{display:flex;align-items:end;justify-content:space-between;margin:30px 0 16px;gap:10px}.section-head h2{font-size:19px;margin:0;letter-spacing:-.04em}.section-head p{color:var(--sub);font-size:13px;margin:7px 0 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.tile{border:1px solid var(--line);background:#fff;border-radius:14px;text-align:left;padding:20px;min-height:135px;color:var(--ink)}.tile:hover{border-color:#9ccbbe;transform:translateY(-2px)}.tile .ico{font-size:19px}.tile b{display:block;font-size:14px;letter-spacing:.03em;margin:14px 0 5px}.tile small{font-size:13px;color:var(--sub);line-height:1.5}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:22px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.grow{flex:1}.field{width:100%;border:1px solid #dce7e3;background:#fff;border-radius:8px;padding:11px 12px;color:var(--ink);outline:none}.field:focus{border-color:#85b9a9}textarea.field{resize:vertical;min-height:105px;line-height:1.6}.records{display:grid;gap:10px;margin-top:14px}.record{padding:16px;border:1px solid var(--line);border-radius:11px;background:#fff}.record-title{font-weight:750;line-height:1.5}.record-meta{font-size:12px;color:#8b9b96;margin-top:6px}.record-body{white-space:pre-wrap;color:#6d7b77;font-size:14px;margin:10px 0 0;line-height:1.5;overflow-wrap:anywhere}.record-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.mini{border:0;border-radius:7px;padding:7px 10px;background:#f0f6f4;color:#55796f;font-size:12px;font-weight:700}.mini.danger{color:#a15c5c;background:#fbf4f4}.empty{text-align:center;padding:38px 10px;color:#93a19d;font-size:14px}.stats{display:flex;gap:20px;color:#6f827b;font-size:13px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.form-grid label{display:block;color:#536b63;font-size:13px;font-weight:700}.form-grid label.full{grid-column:1/-1}.form-grid .field{margin-top:7px}.footnote{color:#8a9c95;font-size:12px;line-height:1.6}.modal{position:fixed;inset:0;background:#253e39aa;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modal.show{display:flex}.dialog{width:min(690px,100%);max-height:90vh;overflow:auto;background:white;border-radius:16px;padding:26px}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.dialog-head h2{font-size:20px;margin:0}.close{border:0;background:none;font-size:26px;color:#7b8f87}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.hint{background:#f1f7f5;border-radius:9px;padding:12px;color:#648176;font-size:13px;line-height:1.6;margin:0 0 17px}.menu-trigger{display:none}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#264d43;color:white;padding:11px 18px;border-radius:8px;display:none;font-size:13px;z-index:10}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.main{padding:28px 24px 70px}.app{grid-template-columns:185px 1fr}.side{padding:25px 12px}}@media(max-width:620px){.app{display:block}.side{position:relative;display:flex;flex-direction:row;align-items:center;overflow:auto;padding:12px;border-bottom:1px solid var(--line);gap:4px}.brand{padding:0 10px 0 0;min-width:95px;font-size:10px}.brand strong{font-size:15px;margin-top:3px}.side small,.sidefoot{display:none}.nav{white-space:nowrap;padding:10px 8px;font-size:12px}.nav span{display:none}.main{padding:24px 16px 60px}.top{align-items:flex-start}.top h1{font-size:19px}.controls .export{display:none}.hero{grid-template-columns:1fr;margin:20px 0}.hero-copy{padding:26px}.hero h2{font-size:24px}.hero-art{display:none}.tile{min-height:116px;padding:16px}.form-grid{grid-template-columns:1fr}.form-grid label.full{grid-column:auto}.dialog{padding:20px}.grid{gap:9px}}
</style></head><body><div class="app"><aside class="side" id="side"></aside><main class="main"><header class="top"><div><div class="tag">YOUR SPACE TO THINK & DO</div><h1 id="pageTitle"></h1></div><div class="controls"><button class="button export" id="backup">백업</button><button class="button primary" id="newBtn">＋ 새 기록</button></div></header><div id="content"></div></main></div><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button class="close" aria-label="닫기" id="close">×</button></div><div id="formHint"></div><form id="form"><div class="form-grid" id="fields"></div><div class="form-actions"><button type="button" class="button" id="cancel">취소</button><button class="button primary" type="submit">저장하기</button></div></form></div></div><div class="toast" id="toast"></div><input type="file" accept="application/json" id="restoreFile" hidden><script>
const types={quick:{name:'QUICK CAPTURE',ko:'빠른 기록',icon:'✎',desc:'떠오른 생각을 한 줄부터',fields:[['date','날짜','date'],['title','빠른 기록','text'],['next','다음 처리','text']]},idea:{name:'IDEA',ko:'아이디어',icon:'✧',desc:'작은 생각을 구체적으로',fields:[['date','날짜','date'],['topic','주제','text'],['title','제목','text'],['content','아이디어','area'],['next','다음 한 걸음','area']]},brain:{name:'BRAIN DUMP',ko:'생각 정리',icon:'◌',desc:'복잡한 머릿속 비우기',fields:[['date','날짜','date'],['title','제목','text'],['content','떠오르는 생각','area'],['next','꺼낸 생각 정리','area']]},action:{name:'ACTION QUEUE',ko:'다음 행동',icon:'✓',desc:'지금 할 수 있는 다음 행동',fields:[['title','다음 행동','text'],['date','기한','date'],['content','메모','area']]},ref:{name:'REFERENCE NOTE',ko:'참고자료',icon:'⌁',desc:'다시 찾아볼 자료 모으기',fields:[['date','날짜','date'],['topic','주제','text'],['title','제목','text'],['source','출처 / 링크','text'],['content','자료 내용','area'],['location','저장 위치','text'],['next','활용할 곳','text']]},note:{name:'NOTE',ko:'자유 노트',icon:'▤',desc:'자유롭게 남기는 기록',fields:[['date','날짜','date'],['title','제목','text'],['style','노트 종류','select:줄 노트|무지 노트|모눈 노트|도트 노트'],['content','내용','area']]},call:{name:'PHONE LOG',ko:'통화 기록',icon:'☎',desc:'통화 내용과 다음 할 일',fields:[['date','날짜 / 시간','datetime-local'],['title','상대 · 연락처','text'],['direction','수신 / 발신','select:확인 필요|수신|발신'],['content','통화 내용','area'],['next','다음 할 일','area']]}};
const key='ampm-quick-note-v1';let data=[];try{data=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(data))data=[]}catch(e){data=[]}
let view='home',editing=null,formType='quick',query='';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(key,JSON.stringify(data));return true}catch(e){alert('저장 공간을 사용할 수 없어요. 브라우저 설정을 확인해 주세요.');return false}}
function notify(s){let t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2300)}
function nav(){ $('#side').innerHTML='<div class="brand">AMPM :D<strong>QUICK NOTE</strong></div><small>MY WORKSPACE</small><button class="nav '+(view==='home'?'active':'')+'" data-view="home"><span>⌂</span> 홈</button>'+Object.entries(types).map(([k,t])=>'<button class="nav '+(view===k?'active':'')+'" data-view="'+k+'"><span>'+t.icon+'</span>'+t.name+'</button>').join('')+'<div class="sidefoot">생각을 기록하고<br>다음 행동으로 이어가요.<br><br>AMPM :D KOREA</div>'; }
function rec(r){let t=types[r.type]||types.quick;return '<article class="record"><div class="row"><div class="grow"><div class="record-title">'+(r.type==='action'?'<input type="checkbox" data-done="'+r.id+'" '+(r.done?'checked':'')+' aria-label="완료 표시"> ':'')+esc(r.title||r.content||'제목 없는 기록')+'</div><div class="record-meta">'+esc(t.name)+' · '+esc((r.date||r.created||'').replace('T',' '))+(r.done?' · 완료':'')+'</div></div></div>'+(r.content&&r.content!==r.title?'<div class="record-body">'+esc(r.content.slice(0,300))+'</div>':'')+(r.next?'<div class="record-body">다음: '+esc(r.next)+'</div>':'')+'<div class="record-actions"><button class="mini" data-edit="'+r.id+'">열기 · 수정</button>'+(r.type!=='action'?'<button class="mini" data-action="'+r.id+'">할 일로 보내기</button>':'')+'<button class="mini danger" data-delete="'+r.id+'">삭제</button></div></article>'}
function render(){nav();$('#pageTitle').textContent=view==='home'?'내 생각이 머무는 곳':types[view].name;$('#newBtn').textContent='＋ 새 기록';let html='';if(view==='home'){let pending=data.filter(x=>x.type==='action'&&!x.done).length;html='<section class="hero"><div class="hero-copy"><div class="eyebrow">A LITTLE SPACE FOR YOUR THOUGHTS</div><h2>떠오른 생각을 가볍게,<br>다음 행동까지 차근차근.</h2><p>지금 적고, 필요한 순간 다시 꺼내보세요.</p></div><div class="hero-art"><div class="circle"></div><div class="paper">QUICK NOTE<i></i><i></i><i></i></div></div></section><div class="section-head"><div><h2>어디에 기록할까요?</h2><p>상황에 맞는 공간을 선택해 보세요.</p></div></div><div class="grid">'+Object.entries(types).map(([k,t])=>'<button class="tile" data-view="'+k+'"><span class="ico">'+t.icon+'</span><b>'+t.name+'</b><small>'+t.desc+'</small></button>').join('')+'</div><div class="section-head"><div><h2>최근 기록</h2><p>전체 '+data.length+'개 · 남은 할 일 '+pending+'개</p></div><button class="button" data-view="action">할 일 보기</button></div><div class="records">'+(data.length?data.slice().reverse().slice(0,4).map(rec).join(''):'<div class="panel empty">아직 기록이 없어요. 가볍게 한 줄부터 시작해 보세요.</div>')+'</div>'}else{let t=types[view];let filtered=data.filter(x=>x.type===view&&JSON.stringify(x).toLowerCase().includes(query.toLowerCase()));html='<div class="section-head"><div><h2>'+t.ko+'</h2><p>'+t.desc+'</p></div><div class="stats">'+filtered.length+'개의 기록</div></div><div class="panel"><div class="row"><input class="field grow" id="search" placeholder="이 공간에서 기록 검색" value="'+esc(query)+'" aria-label="기록 검색"><button class="button primary" id="addHere">＋ 기록하기</button></div><div class="records">'+(filtered.length?filtered.slice().reverse().map(rec).join(''):'<div class="empty">아직 표시할 기록이 없어요.<br>새 기록을 만들어 보세요.</div>')+'</div></div>'}html+='<p class="footnote" style="margin-top:25px">기록은 현재 사용 중인 브라우저에만 저장돼요. 다른 기기와 자동 동기화되지 않으며, 브라우저 데이터 삭제 시 사라질 수 있어요. 백업 파일을 저장해 주세요. <button class="mini" id="backup2">백업</button> <button class="mini" id="restore">백업 불러오기</button></p>';$('#content').innerHTML=html}
function openForm(type,id=null){formType=type;editing=id;let t=types[type],r=data.find(x=>x.id===id)||{};$('#dialogTitle').textContent=(id?'기록 수정 · ':'새 기록 · ')+t.name;$('#formHint').innerHTML=type==='call'?'<p class="hint">통화 내용이나 전사문을 직접 붙여넣어 기록할 수 있어요. 통화 자동 녹음 및 AI 요약은 아직 제공하지 않아요.</p>':'';$('#fields').innerHTML=t.fields.map(([name,label,kind])=>{let val=r[name]||(!id&&name==='date'&&kind==='date'?new Date().toLocaleDateString('sv-SE'):'');let field=kind==='area'?'<textarea class="field" name="'+name+'">'+esc(val)+'</textarea>':kind.startsWith('select:')?'<select class="field" name="'+name+'">'+kind.slice(7).split('|').map(o=>'<option '+(val===o?'selected':'')+'>'+o+'</option>').join('')+'</select>':'<input class="field" name="'+name+'" type="'+kind+'" value="'+esc(val)+'">';return '<label class="'+(kind==='area'?'full':'')+'">'+label+field+'</label>'}).join('');$('#modal').classList.add('show');setTimeout(()=>$('#fields input, #fields textarea')?.focus(),20)}
function close(){ $('#modal').classList.remove('show') }
$('#form').addEventListener('submit',e=>{e.preventDefault();let values=Object.fromEntries(new FormData(e.target));if(!Object.values(values).some((v,i)=>v&&i>0)){alert('기록할 내용을 입력해 주세요.');return}if(editing){let r=data.find(x=>x.id===editing);Object.assign(r,values)}else data.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),type:formType,created:new Date().toLocaleDateString('sv-SE'),done:false,...values});if(save()){close();render();notify('기록을 저장했어요.')}});
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;query='';render();window.scrollTo(0,0)}else if(b.id==='newBtn'||b.id==='addHere')openForm(view==='home'?'quick':view);else if(b.id==='close'||b.id==='cancel')close();else if(b.dataset.edit){let r=data.find(x=>x.id===b.dataset.edit);if(r)openForm(r.type,r.id)}else if(b.dataset.delete){if(confirm('이 기록을 삭제할까요?')){data=data.filter(x=>x.id!==b.dataset.delete);save();render()}}else if(b.dataset.action){let r=data.find(x=>x.id===b.dataset.action);let next=prompt('할 일로 보낼 내용을 확인해 주세요.',r.next||r.title||r.content||'');if(next?.trim()){data.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),type:'action',title:next.trim(),content:'원본: '+(r.title||types[r.type].ko),sourceId:r.id,created:new Date().toLocaleDateString('sv-SE'),done:false});save();notify('ACTION에 추가했어요.')}}else if(b.id==='backup'||b.id==='backup2'){let blob=new Blob([JSON.stringify({format:'AMPM_QUICK_NOTE',version:1,records:data},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ampm-quick-note-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}else if(b.id==='restore')$('#restoreFile').click()});
document.addEventListener('change',e=>{if(e.target.dataset.done){let r=data.find(x=>x.id===e.target.dataset.done);if(r){r.done=e.target.checked;save();render()}}});document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let pos=e.target.selectionStart;render();let f=$('#search');f.focus();f.setSelectionRange(pos,pos)}});$('#restoreFile').addEventListener('change',async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(d.format!=='AMPM_QUICK_NOTE'||!Array.isArray(d.records)||!d.records.every(r=>r&&types[r.type]&&typeof r.id==='string'))throw Error();if(confirm('현재 기록을 백업 파일의 기록으로 교체할까요? 먼저 현재 기록을 백업해 두세요.')){data=d.records;save();render();notify('백업을 불러왔어요.')}}catch(err){alert('올바른 퀵노트 백업 파일을 선택해 주세요.')}e.target.value=''});$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});render();
</script></body></html>
